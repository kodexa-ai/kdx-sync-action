# Test workflow for the Kodexa Sync action
# Validates the action works across different platforms

name: Test Action

on:
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Create test sync config
        shell: bash
        run: |
          mkdir -p test-metadata/organizations/test-org
          cat > sync-config.yaml << EOF
          metadata_dir: test-metadata
          branch_mappings:
            - pattern: "*"
              target: test
              environment: test
          environments:
            test:
              url: https://test.kodexa.com
              api_key_from_env: KODEXA_TEST_API_KEY
          targets:
            test:
              manifests:
                - organizations/test-org/manifest.yaml
          EOF

      - name: Test action (dry run)
        uses: ./
        with:
          sync-config: sync-config.yaml
          dry-run: true
        continue-on-error: true  # Expected to fail without real credentials
        env:
          KODEXA_TEST_API_KEY: test-token-12345

      - name: Verify kdx was installed
        shell: bash
        run: |
          if command -v kdx &> /dev/null; then
            echo "✅ kdx installed successfully"
            kdx version
          else
            echo "❌ kdx not found in PATH"
            exit 1
          fi

  test-versions:
    name: Test kdx version ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - latest

    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Create test config
        run: |
          mkdir -p test-metadata/organizations/test-org
          cat > sync-config.yaml << EOF
          metadata_dir: test-metadata
          branch_mappings:
            - pattern: "*"
              target: test
              environment: test
          environments:
            test:
              url: https://test.kodexa.com
              api_key_from_env: KODEXA_TEST_API_KEY
          targets:
            test:
              manifests:
                - organizations/test-org/manifest.yaml
          EOF

      - name: Test with kdx ${{ matrix.version }}
        uses: ./
        with:
          kdx-version: ${{ matrix.version }}
          sync-config: sync-config.yaml
          dry-run: true
        continue-on-error: true
        env:
          KODEXA_TEST_API_KEY: test-token

      - name: Verify version
        run: |
          kdx version

  validate-action:
    name: Validate action.yml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Validate action metadata
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/*.yml

  test-outputs:
    name: Test action outputs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout action
        uses: actions/checkout@v4

      - name: Create test config
        run: |
          mkdir -p test-metadata/organizations/test-org
          cat > sync-config.yaml << EOF
          metadata_dir: test-metadata
          branch_mappings:
            - pattern: "*"
              target: test
              environment: test
          environments:
            test:
              url: https://test.kodexa.com
              api_key_from_env: KODEXA_TEST_API_KEY
          targets:
            test:
              manifests:
                - organizations/test-org/manifest.yaml
          EOF

      - name: Run action
        id: sync
        uses: ./
        with:
          sync-config: sync-config.yaml
          dry-run: true
        continue-on-error: true
        env:
          KODEXA_TEST_API_KEY: test-token

      - name: Check outputs
        run: |
          echo "Targets: ${{ steps.sync.outputs.targets-deployed }}"
          echo "Created: ${{ steps.sync.outputs.resources-created }}"
          echo "Updated: ${{ steps.sync.outputs.resources-updated }}"
          echo "Skipped: ${{ steps.sync.outputs.resources-skipped }}"
