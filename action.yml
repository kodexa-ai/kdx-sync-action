name: 'Kodexa Sync'
description: 'GitOps deployment for Kodexa metadata - branch mappings drive everything'
author: 'Kodexa, Inc.'

branding:
  icon: 'refresh-cw'
  color: 'blue'

inputs:
  sync-config:
    description: 'Path to sync-config.yaml (auto-discovered if not specified)'
    required: false
    default: ''

  metadata-dir:
    description: 'Metadata directory override (auto-discovered if not specified)'
    required: false
    default: ''

  dry-run:
    description: 'Preview deployment without making changes (true/false)'
    required: false
    default: 'false'

  kdx-version:
    description: 'kdx-cli version to use (default: latest)'
    required: false
    default: 'latest'

  threads:
    description: 'Number of parallel threads for resource deployment (default: 8)'
    required: false
    default: '8'

  filter:
    description: 'Filter pattern for resources (e.g., "invoice-*")'
    required: false
    default: ''

  branch:
    description: 'Override branch detection with specific branch mapping'
    required: false
    default: ''

  tag:
    description: 'Override branch detection with specific tag mapping'
    required: false
    default: ''

  slack-channel-id:
    description: 'Slack channel ID to post deployment summary (optional)'
    required: false
    default: ''

  slack-token:
    description: 'Slack Bot Token for posting messages (optional)'
    required: false
    default: ''

  use-prerelease:
    description: 'Use prerelease (develop) version of kdx-cli (true/false)'
    required: false
    default: 'false'

  annotate-summary:
    description: 'Add deployment summary to GitHub Actions job summary (true/false)'
    required: false
    default: 'false'

outputs:
  targets-deployed:
    description: 'Number of targets deployed'
    value: ${{ steps.sync.outputs.targets }}

  resources-created:
    description: 'Number of resources created'
    value: ${{ steps.sync.outputs.resources_created }}

  resources-updated:
    description: 'Number of resources updated'
    value: ${{ steps.sync.outputs.resources_updated }}

  resources-skipped:
    description: 'Number of resources skipped (unchanged)'
    value: ${{ steps.sync.outputs.resources_skipped }}

  json-report-path:
    description: 'Path to the JSON report file'
    value: ${{ steps.sync.outputs.json_report_path }}

runs:
  using: 'composite'
  steps:
    - name: Detect OS and Architecture
      id: detect
      shell: bash
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        # Normalize OS name
        case "$OS" in
          linux*)   OS="linux" ;;
          darwin*)  OS="darwin" ;;
          mingw*)   OS="windows" ;;
          msys*)    OS="windows" ;;
          cygwin*)  OS="windows" ;;
          *)        echo "❌ Unsupported OS: $OS"; exit 1 ;;
        esac

        # Normalize architecture
        case "$ARCH" in
          x86_64|amd64)   ARCH="x86_64" ;;
          aarch64|arm64)  ARCH="arm64" ;;
          *)              echo "❌ Unsupported architecture: $ARCH"; exit 1 ;;
        esac

        echo "os=$OS" >> $GITHUB_OUTPUT
        echo "arch=$ARCH" >> $GITHUB_OUTPUT
        echo "📋 Detected: $OS/$ARCH"

    - name: Determine kdx version
      id: version
      shell: bash
      run: |
        VERSION="${{ inputs.kdx-version }}"
        USE_PRERELEASE="${{ inputs.use-prerelease }}"

        if [[ "$VERSION" == "latest" ]]; then
          if [[ "$USE_PRERELEASE" == "true" ]]; then
            echo "🔍 Fetching latest prerelease (develop) kdx version..."
            JQ_FILTER='[.[] | select(.tag_name | test("develop")) | select(.draft | not)] | .[0].tag_name'
          else
            echo "🔍 Fetching latest stable kdx version..."
            JQ_FILTER='[.[] | select(.tag_name | test("develop") | not) | select(.draft | not)] | .[0].tag_name'
          fi

          # Paginate through releases until we find a match
          LATEST=""
          PAGE=1
          while [[ -z "$LATEST" || "$LATEST" == "null" ]]; do
            BODY=$(curl -s "https://api.github.com/repos/kodexa-ai/kdx-cli-releases/releases?per_page=100&page=${PAGE}")
            LATEST=$(echo "$BODY" | jq -r "$JQ_FILTER")

            # Check if we got an empty page (no more releases)
            RELEASE_COUNT=$(echo "$BODY" | jq 'length')
            if [[ "$RELEASE_COUNT" -eq 0 ]]; then
              echo "❌ No matching release found after scanning all pages"
              exit 1
            fi

            if [[ -n "$LATEST" && "$LATEST" != "null" ]]; then
              break
            fi

            PAGE=$((PAGE + 1))
            echo "  Scanning page $PAGE..."

            # Safety limit to avoid infinite loops
            if [[ $PAGE -gt 20 ]]; then
              echo "❌ Failed to find matching release after 20 pages"
              exit 1
            fi
          done

          VERSION="$LATEST"
          echo "✅ Latest version: $VERSION"
        fi

        # Determine binary name: use-prerelease flag or auto-detect from version tag
        if [[ "$USE_PRERELEASE" == "true" ]] || [[ "$VERSION" == *"develop"* ]]; then
          echo "binary_name=kdx-dev" >> $GITHUB_OUTPUT
        else
          echo "binary_name=kdx" >> $GITHUB_OUTPUT
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Cache kdx binary
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/kdx-bin
        key: kdx-${{ steps.version.outputs.version }}-${{ steps.detect.outputs.os }}-${{ steps.detect.outputs.arch }}

    - name: Download kdx binary
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        OS="${{ steps.detect.outputs.os }}"
        ARCH="${{ steps.detect.outputs.arch }}"
        BINARY_NAME="${{ steps.version.outputs.binary_name }}"

        # Construct download URL based on goreleaser naming
        # Prerelease uses kdx-dev as archive/binary name, stable uses kdx
        if [[ "$OS" == "windows" ]]; then
          ARCHIVE="${BINARY_NAME}_${VERSION#v}_${OS}_${ARCH}.zip"
          BINARY="${BINARY_NAME}.exe"
        else
          ARCHIVE="${BINARY_NAME}_${VERSION#v}_${OS}_${ARCH}.tar.gz"
          BINARY="${BINARY_NAME}"
        fi

        DOWNLOAD_URL="https://github.com/kodexa-ai/kdx-cli-releases/releases/download/${VERSION}/${ARCHIVE}"

        echo "📥 Downloading ${BINARY_NAME} from: $DOWNLOAD_URL"

        mkdir -p "${{ runner.temp }}/kdx-download"
        cd "${{ runner.temp }}/kdx-download"

        if ! curl -sL -f "$DOWNLOAD_URL" -o "$ARCHIVE"; then
          echo "❌ Failed to download ${BINARY_NAME} from $DOWNLOAD_URL"
          echo "Available releases: https://github.com/kodexa-ai/kdx-cli-releases/releases"
          exit 1
        fi

        # Extract archive
        if [[ "$OS" == "windows" ]]; then
          unzip -q "$ARCHIVE"
        else
          tar -xzf "$ARCHIVE"
        fi

        # Move binary to cache location
        # Always name it 'kdx' (or 'kdx.exe') on PATH so downstream steps work uniformly
        mkdir -p "${{ runner.temp }}/kdx-bin"
        if [[ "$BINARY" != "kdx" && "$BINARY" != "kdx.exe" ]]; then
          TARGET_BINARY="${BINARY/kdx-dev/kdx}"
          mv "$BINARY" "${{ runner.temp }}/kdx-bin/$TARGET_BINARY"
          chmod +x "${{ runner.temp }}/kdx-bin/$TARGET_BINARY"
        else
          mv "$BINARY" "${{ runner.temp }}/kdx-bin/"
          chmod +x "${{ runner.temp }}/kdx-bin/$BINARY"
        fi

        echo "✅ Downloaded ${BINARY_NAME} $VERSION"

    - name: Add kdx to PATH
      shell: bash
      run: |
        echo "${{ runner.temp }}/kdx-bin" >> $GITHUB_PATH

    - name: Verify kdx installation
      shell: bash
      run: |
        kdx version

    - name: Run kdx sync deploy
      id: sync
      shell: bash
      run: |
        set -e

        # Generate JSON report path
        JSON_REPORT_PATH="${{ runner.temp }}/kdx-deploy-report.json"

        # Build command - simple and opinionated
        # --skip-production-confirm prevents interactive prompts in CI/CD
        CMD="kdx sync deploy --skip-production-confirm"

        # Add optional config path
        if [[ -n "${{ inputs.sync-config }}" ]]; then
          CMD="$CMD --config \"${{ inputs.sync-config }}\""
        fi

        # Add optional metadata directory
        if [[ -n "${{ inputs.metadata-dir }}" ]]; then
          CMD="$CMD --metadata-dir \"${{ inputs.metadata-dir }}\""
        fi

        # Add dry-run flag if requested
        if [[ "${{ inputs.dry-run }}" == "true" ]]; then
          CMD="$CMD --dry-run"
        fi

        # Add threads (default: 8 for parallel execution)
        THREADS="${{ inputs.threads }}"
        if [[ -n "$THREADS" && "$THREADS" != "0" ]]; then
          CMD="$CMD --threads $THREADS"
        fi

        # Add filter if specified
        if [[ -n "${{ inputs.filter }}" ]]; then
          CMD="$CMD --filter \"${{ inputs.filter }}\""
        fi

        # Add branch override if specified
        if [[ -n "${{ inputs.branch }}" ]]; then
          CMD="$CMD --branch \"${{ inputs.branch }}\""
        fi

        # Add tag override if specified
        if [[ -n "${{ inputs.tag }}" ]]; then
          CMD="$CMD --tag \"${{ inputs.tag }}\""
        fi

        # Always generate JSON report for structured output
        CMD="$CMD --output-json \"$JSON_REPORT_PATH\""

        echo "🚀 Command: $CMD"

        # Run deployment - stream output in real-time AND capture for parsing
        # Using tee to both display and capture output
        set +e  # Don't exit on error yet
        OUTPUT=$(eval "$CMD" 2>&1 | tee /dev/stderr)
        EXIT_CODE=$?
        set -e

        if [[ $EXIT_CODE -ne 0 ]]; then
          echo ""
          echo "❌ Deployment failed with exit code $EXIT_CODE"
          if [[ -z "$OUTPUT" ]]; then
            echo "⚠️  No output was produced by kdx. This may indicate:"
            echo "   - Missing or invalid API key environment variable"
            echo "   - Configuration file not found"
            echo "   - Invalid sync-config.yaml format"
          fi
          exit $EXIT_CODE
        fi

        # Parse output for statistics (best effort)
        # Match patterns like "Resources: 75 updated" or "project: 2 updated, 3 unchanged"
        # Use sed for portability (works on both GNU and BSD)
        UPDATED=$(echo "$OUTPUT" | sed -n 's/.*Resources:[[:space:]]*\([0-9]*\)[[:space:]]*updated/\1/p' | head -1)
        UPDATED=${UPDATED:-0}
        CREATED=$(echo "$OUTPUT" | sed -n 's/.*resources\?:[[:space:]]*\([0-9]*\)[[:space:]]*created.*/\1/p' | head -1)
        CREATED=${CREATED:-0}
        SKIPPED=$(echo "$OUTPUT" | sed -n 's/.*resources\?:[[:space:]]*\([0-9]*\)[[:space:]]*unchanged.*/\1/p' | head -1)
        SKIPPED=${SKIPPED:-0}
        # Count number of "Planned deployment" lines for targets
        TARGETS=$(echo "$OUTPUT" | grep -c "Planned deployment" || echo "0")

        echo "targets=$TARGETS" >> $GITHUB_OUTPUT
        echo "resources_created=$CREATED" >> $GITHUB_OUTPUT
        echo "resources_updated=$UPDATED" >> $GITHUB_OUTPUT
        echo "resources_skipped=$SKIPPED" >> $GITHUB_OUTPUT

        # Output JSON report path and content
        echo "json_report_path=$JSON_REPORT_PATH" >> $GITHUB_OUTPUT

        # Log JSON report if it exists (use json_report_path output to read in subsequent steps)
        if [[ -f "$JSON_REPORT_PATH" ]]; then
          echo "📊 JSON Report generated at: $JSON_REPORT_PATH"
          echo "📊 JSON Report Contents:"
          cat "$JSON_REPORT_PATH"
          echo ""
          echo "💡 Use \${{ steps.sync.outputs.json_report_path }} to read the report in subsequent steps"
        fi

        echo "✅ Deployment completed successfully"

    - name: Generate GitHub Job Summary
      if: inputs.annotate-summary == 'true'
      shell: bash
      run: |
        CREATED="${{ steps.sync.outputs.resources_created }}"
        UPDATED="${{ steps.sync.outputs.resources_updated }}"
        SKIPPED="${{ steps.sync.outputs.resources_skipped }}"
        TARGETS="${{ steps.sync.outputs.targets }}"
        DRY_RUN="${{ inputs.dry-run }}"
        JSON_REPORT_PATH="${{ steps.sync.outputs.json_report_path }}"

        # Determine status emoji and text
        if [[ "$DRY_RUN" == "true" ]]; then
          STATUS_EMOJI="🔍"
          STATUS_TEXT="Dry Run Preview"
        else
          STATUS_EMOJI="🚀"
          STATUS_TEXT="Deployment Complete"
        fi

        # Calculate total
        TOTAL=$((CREATED + UPDATED + SKIPPED))

        # Write summary header
        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## $STATUS_EMOJI Kodexa $STATUS_TEXT

        ### 📊 Summary

        | Metric | Count |
        |--------|-------|
        | 🆕 Created | $CREATED |
        | 🔄 Updated | $UPDATED |
        | ⏭️ Unchanged | $SKIPPED |
        | **Total** | **$TOTAL** |

        ### 📍 Details

        | Property | Value |
        |----------|-------|
        | Repository | \`${{ github.repository }}\` |
        | Branch | \`${{ github.ref_name }}\` |
        | Commit | \`${{ github.sha }}\` |
        | Actor | @${{ github.actor }} |
        | Targets | $TARGETS |

        EOF

        # Add deployment breakdown if JSON report exists
        if [[ -f "$JSON_REPORT_PATH" ]]; then
          if command -v jq &> /dev/null; then
            # Extract deployment stats - counts resources by action type per deployment
            DEPLOY_INFO=$(jq -r '
              .deployments // [] |
              map(
                . as $d |
                ($d.resources // [] | map(select(.action == "updated")) | length) as $updated |
                ($d.resources // [] | map(select(.action == "created")) | length) as $created |
                ($d.resources // [] | map(select(.action == "skipped" or .action == "unchanged")) | length) as $skipped |
                "| [\($d.environment)](\($d.url)) | \($updated) | \($created) | \($skipped) |"
              ) |
              join("\n")
            ' "$JSON_REPORT_PATH" 2>/dev/null || echo "")
            if [[ -n "$DEPLOY_INFO" ]]; then
              cat >> $GITHUB_STEP_SUMMARY << EOF

        ### 🌐 Deployments

        | Environment | Updated | Created | Unchanged |
        |-------------|---------|---------|-----------|
        $DEPLOY_INFO

        EOF
            fi
          fi
        fi

        echo "📋 GitHub Job Summary generated"

    - name: Send Slack Notification
      if: inputs.slack-channel-id != '' && inputs.slack-token != ''
      shell: bash
      run: |
        CREATED="${{ steps.sync.outputs.resources_created }}"
        UPDATED="${{ steps.sync.outputs.resources_updated }}"
        SKIPPED="${{ steps.sync.outputs.resources_skipped }}"
        DRY_RUN="${{ inputs.dry-run }}"
        CHANNEL_ID="${{ inputs.slack-channel-id }}"
        SLACK_TOKEN="${{ inputs.slack-token }}"
        JSON_REPORT_PATH="${{ steps.sync.outputs.json_report_path }}"

        # Calculate total
        TOTAL=$((CREATED + UPDATED + SKIPPED))

        # Determine status
        if [[ "$DRY_RUN" == "true" ]]; then
          STATUS_EMOJI=":mag:"
          STATUS_TEXT="Dry Run Preview"
          COLOR="#3498db"
        else
          STATUS_EMOJI=":rocket:"
          STATUS_TEXT="Deployment Complete"
          COLOR="#2ecc71"
        fi

        # Build run URL
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        # Build environment breakdown from JSON report if available
        ENV_BLOCKS=""
        if [[ -f "$JSON_REPORT_PATH" ]] && command -v jq &> /dev/null; then
          # Extract deployment stats from JSON - counts resources by action type per deployment
          ENV_TEXT=$(jq -r '
            .deployments // [] |
            map(
              . as $d |
              ($d.resources // [] | map(select(.action == "updated")) | length) as $updated |
              ($d.resources // [] | map(select(.action == "created")) | length) as $created |
              ($d.resources // [] | map(select(.action == "skipped" or .action == "unchanged")) | length) as $skipped |
              "• <\($d.url)|\($d.environment)>: \($updated) updated, \($created) created, \($skipped) unchanged"
            ) |
            join("\n")
          ' "$JSON_REPORT_PATH" 2>/dev/null || echo "")

          if [[ -n "$ENV_TEXT" && "$ENV_TEXT" != "" ]]; then
            ENV_BLOCKS=',
            {
              "type": "divider"
            },
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "*:globe_with_meridians: Deployments:*\n'"$ENV_TEXT"'"
              }
            }'
          fi
        fi

        # Create Slack Block Kit message
        SLACK_PAYLOAD=$(cat << EOFSLACK
        {
          "channel": "$CHANNEL_ID",
          "blocks": [
            {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": "$STATUS_EMOJI Kodexa $STATUS_TEXT",
                "emoji": true
              }
            },
            {
              "type": "section",
              "fields": [
                {
                  "type": "mrkdwn",
                  "text": "*Repository:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Branch:*\n\`${{ github.ref_name }}\`"
                }
              ]
            },
            {
              "type": "section",
              "fields": [
                {
                  "type": "mrkdwn",
                  "text": ":sparkles: *Created:* $CREATED"
                },
                {
                  "type": "mrkdwn",
                  "text": ":arrows_counterclockwise: *Updated:* $UPDATED"
                },
                {
                  "type": "mrkdwn",
                  "text": ":fast_forward: *Unchanged:* $SKIPPED"
                },
                {
                  "type": "mrkdwn",
                  "text": ":bar_chart: *Total:* $TOTAL"
                }
              ]
            }$ENV_BLOCKS,
            {
              "type": "context",
              "elements": [
                {
                  "type": "mrkdwn",
                  "text": "Triggered by *${{ github.actor }}* | <$RUN_URL|View Run #${{ github.run_number }}>"
                }
              ]
            }
          ],
          "attachments": [
            {
              "color": "$COLOR"
            }
          ]
        }
        EOFSLACK
        )

        # Send to Slack
        RESPONSE=$(curl -s -X POST "https://slack.com/api/chat.postMessage" \
          -H "Authorization: Bearer $SLACK_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$SLACK_PAYLOAD")

        # Check response
        OK=$(echo "$RESPONSE" | grep -o '"ok":true' || echo "")
        if [[ -n "$OK" ]]; then
          echo "✅ Slack notification sent successfully"
        else
          echo "⚠️ Slack notification may have failed. Response: $RESPONSE"
        fi
