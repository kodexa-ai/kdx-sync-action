# Basic sync configuration
# Branch mappings drive deployment - push to main deploys to production

metadata_dir: kodexa-metadata

branch_mappings:
  - pattern: "main"
    target: production
    environment: prod

environments:
  prod:
    url: https://platform.kodexa.com
    api_key_from_env: KODEXA_PROD_API_KEY

targets:
  production:
    manifests:
      - organizations/my-organization/manifest.yaml
