# Pull request validation workflow
# Validates sync configuration on PRs with dry-run mode

name: Validate Sync Configuration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'kodexa-metadata/**'
      - 'sync-config.yaml'
      - '.github/workflows/**'

jobs:
  validate:
    name: Validate Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dry run sync
        id: validate
        uses: kodexa-ai/kdx-sync-action@v2
        with:
          dry-run: true
        continue-on-error: true
        env:
          KODEXA_DEV_API_KEY: ${{ secrets.KODEXA_DEV_API_KEY }}

      - name: Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ steps.validate.outcome }}' === 'success' ? '✅' : '❌';
            const message = `### ${status} Sync Validation

            **Targets:** ${{ steps.validate.outputs.targets-deployed }}
            **Resources to create:** ${{ steps.validate.outputs.resources-created }}
            **Resources to update:** ${{ steps.validate.outputs.resources-updated }}
            **Resources unchanged:** ${{ steps.validate.outputs.resources-skipped }}

            ${status === '✅' ? 'Validation passed! Merging this PR will sync these changes to Kodexa.' : 'Validation failed! Please check the workflow logs for details.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Fail if validation failed
        if: steps.validate.outcome != 'success'
        run: exit 1
