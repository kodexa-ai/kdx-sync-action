# Manual deployment workflow with approval
# Allows manual triggering with optional dry-run mode
# Uses branch_mappings from sync-config.yaml for environment resolution

name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch mapping to use for deployment'
        required: true
        type: choice
        options:
          - main
          - staging
          - develop
      dry-run:
        description: 'Dry run mode (preview only)'
        required: false
        type: boolean
        default: false
      filter:
        description: 'Filter resources by pattern (optional)'
        required: false
        type: string

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.branch }} mapping)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kodexa
        id: sync
        uses: kodexa-ai/kdx-sync-action@v2
        with:
          branch: ${{ github.event.inputs.branch }}
          dry-run: ${{ github.event.inputs.dry-run }}
          filter: ${{ github.event.inputs.filter }}
          annotate-summary: true
        env:
          KODEXA_PROD_API_KEY: ${{ secrets.KODEXA_PROD_API_KEY }}
          KODEXA_STAGING_API_KEY: ${{ secrets.KODEXA_STAGING_API_KEY }}
          KODEXA_DEV_API_KEY: ${{ secrets.KODEXA_DEV_API_KEY }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check the logs for details."
