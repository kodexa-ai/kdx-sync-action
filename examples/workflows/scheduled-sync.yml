# Scheduled sync workflow
# Automatically syncs on a schedule to keep environments in sync

name: Scheduled Sync

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'

  workflow_dispatch:  # Allow manual triggers

jobs:
  sync:
    name: Scheduled Metadata Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync to Kodexa
        id: sync
        uses: kodexa-ai/kdx-sync-action@v2
        with:
          annotate-summary: true
        env:
          KODEXA_PROD_API_KEY: ${{ secrets.KODEXA_PROD_API_KEY }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Scheduled sync failed at $(date -u)"
          # Add notification logic (Slack, PagerDuty, etc.)
