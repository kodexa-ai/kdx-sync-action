# Basic sync workflow
# Syncs to Kodexa on every push to main branch
# Branch mappings in sync-config.yaml determine where resources are deployed

name: Sync to Kodexa

on:
  push:
    branches:
      - main

jobs:
  sync:
    name: Sync Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync to Kodexa
        uses: kodexa-ai/kdx-sync-action@v2
        env:
          KODEXA_PROD_API_KEY: ${{ secrets.KODEXA_PROD_API_KEY }}

      - name: Report results
        if: success()
        run: |
          echo "✅ Sync completed successfully"
