# Multi-environment deployment workflow
# Deploys to different Kodexa environments based on branch
# All environment logic is handled by branch_mappings in sync-config.yaml

name: Multi-Environment Sync

on:
  push:
    branches:
      - main        # Production
      - staging     # Staging
      - develop     # Development

jobs:
  sync:
    name: Deploy to Kodexa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kodexa
        id: sync
        uses: kodexa-ai/kdx-sync-action@v2
        with:
          annotate-summary: true
        env:
          KODEXA_PROD_API_KEY: ${{ secrets.KODEXA_PROD_API_KEY }}
          KODEXA_STAGING_API_KEY: ${{ secrets.KODEXA_STAGING_API_KEY }}
          KODEXA_DEV_API_KEY: ${{ secrets.KODEXA_DEV_API_KEY }}
