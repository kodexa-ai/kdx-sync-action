# Complete sync configuration example
# Shows branch mappings, tag mappings, multiple environments, and targets

metadata_dir: kodexa-metadata

# Branch determines deployment target
branch_mappings:
  # Production
  - pattern: "main"
    target: production
    environment: prod

  # Staging
  - pattern: "staging"
    target: staging
    environment: staging

  # Development
  - pattern: "develop"
    target: development
    environment: dev

  - pattern: "feature/*"
    target: development
    environment: dev

  # Hotfix deploys to both staging and production
  - pattern: "hotfix/*"
    targets:
      - name: staging
        environment: staging
      - name: production
        environment: prod

# Tag-based deployments (optional)
tag_mappings:
  - pattern: "v*"
    target: production
    environment: prod

  - pattern: "rc-*"
    target: staging
    environment: staging

# Environment API endpoints
environments:
  prod:
    url: https://platform.kodexa.com
    api_key_from_env: KODEXA_PROD_API_KEY

  staging:
    url: https://staging.kodexa.com
    api_key_from_env: KODEXA_STAGING_API_KEY

  dev:
    url: https://dev.kodexa.com
    api_key_from_env: KODEXA_DEV_API_KEY

# Targets define what gets deployed
targets:
  production:
    manifests:
      - organizations/production-org/manifest.yaml
      - organizations/production-org/modules/*/manifest.yaml

  staging:
    manifests:
      - organizations/production-org/manifest.yaml

  development:
    manifests:
      - organizations/production-org/manifest.yaml
